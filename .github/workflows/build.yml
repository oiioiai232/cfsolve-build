name: Build cfsolve aarch64
on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build aarch64
        run: cross build --release --bin challenge --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir -p out
          cp target/aarch64-unknown-linux-gnu/release/challenge out/
          cp -r profiles out/
          tar czf cfsolve-aarch64.tar.gz -C out .
          ls -lh cfsolve-aarch64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cfsolve-aarch64
          path: cfsolve-aarch64.tar.gz
